version: "3.9"

networks:
  proxy-network:
    external: true
  
services:
  app:
    build: .
    container_name: liars-bar-app
    volumes:
      - .:/app
    command: uvicorn game_server:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - proxy-network
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prototype.rule=Host(`liars.prototype.ai-labs.vip`)"
      - "traefik.http.routers.prototype.entrypoints=websecure"
      - "traefik.http.routers.prototype.service=prototype-svc"
      - "traefik.http.routers.prototype.tls.certresolver=myresolver"
      - "traefik.http.services.prototype-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.prototype.middlewares=office-whitelist@file,prototype-basic-auth@file"
    restart: unless-stopped
