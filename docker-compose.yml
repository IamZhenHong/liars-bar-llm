version: "3.9"

networks:
  proxy-network:
    external: true
  
services:
  app:
    build: .
    container_name: ludo-llm-app
    volumes:
      - .:/app
    command: uvicorn game_server:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - proxy-network
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ludo.rule=Host(`ludo.prototype.ai-labs.vip`)"
      - "traefik.http.routers.ludo.entrypoints=websecure"
      - "traefik.http.routers.ludo.tls.certresolver=myresolver"
      - "traefik.http.routers.ludo.service=ludo-prototype-svc"
      - "traefik.http.services.ludo-prototype-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.ludo.middlewares=office-whitelist@file,prototype-basic-auth@file"
    restart: unless-stopped
