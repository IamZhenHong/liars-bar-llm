version: "3.9"

services:
  app:
    build: .
    container_name: liars-bar-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn game_server:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      - http_proxy=http://10.48.23.75:3128
      - https_proxy=http://10.48.23.75:3128
      - no_proxy=localhost,127.0.0.1,0.0.0.0
    restart: unless-stopped