<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Game</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Announcement Log */
    #announcement-log-container { margin-top: 20px; }
    #announcement-log {
      border: 1px solid #ccc; padding: 10px;
      max-height: 200px; overflow-y: auto;
      background: #f9f9f9;
    }

    /* Game State Log */
    #game-state-container { margin-top: 20px; }
    #game-state-log {
      border: 1px solid #ccc; padding: 10px;
      min-height: 40px; background: #222;
      color: #f0f0f0; font-family: monospace;
      white-space: pre-wrap;
    }

    /* Board */
    #ludo-board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows:    repeat(15, 1fr);
      width: 450px; height: 450px;
      gap: 2px; border: 2px solid #333;
    }
    .cell { position: relative; background: #fff; border: 1px solid #ccc; }
    .token {
      position: absolute; top: 10%; left: 10%;
      width: 80%; height: 80%; border-radius: 50%;
    }

    .red    { background-color: red; }
    .blue   { background-color: blue; }
    .green  { background-color: green; }
    .yellow { background-color: gold; }

    .red-home    { background: #f8d7da; }
    .blue-home   { background: #d1ecf1; }
    .yellow-home { background: #fff3cd; }
    .green-home  { background: #d4edda; }

    .safe { box-shadow: inset 0 0 0 2px #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ludo Game</h1>

    <div id="setup-form">
      <h2>Game Setup</h2>
      <form id="start-game-form">
        <label>
          Number of human players:
          <input type="number" id="num-humans" min="1" max="4" value="1">
        </label>
        <label style="margin-left: 1em;">
          Number of AI players:
          <input type="number" id="num-ais" min="0" max="3" value="1">
        </label>
        <div id="player-count-error" style="color:red; display:none;">
          Total players cannot exceed 4!
        </div>

        <div id="human-names"></div>
        <div id="ai-players-config"><h3>AI Players</h3></div>
        <button type="submit">Start Game</button>
      </form>
    </div>

    <div id="game-interface" style="display:none">
      <h2 id="status"></h2>

      <div id="roll-dice-form" style="display:none">
        <h3>Your Turn — Roll the Dice 🎲</h3>
        <button onclick="submitRollDice()">Roll</button>
      </div>

      <div id="token-select-form" style="display:none">
        <h3>Choose a Token to Move</h3>
        <div id="token-options"></div>
        <button onclick="submitTokenMove()">Move Token</button>
      </div>

      <div id="ludo-board-container">
        <h3>Ludo Board</h3>
        <div id="ludo-board"></div>
      </div>
    </div>
  </div>

  <div id="announcement-log-container">
    <h3>Announcement Log</h3>
    <div id="announcement-log">
      <p id="announcement-placeholder">No announcements yet.</p>
    </div>
  </div>

  <div id="game-state-container">
    <h3>Game State</h3>
    <div id="game-state-log">
      <p id="game-state-placeholder">No game state available yet.</p>
    </div>
  </div>

  <script>
    let socket = null;
    let playerName = "";

    // ─── Dynamic player count UI ────────────────────────────────────────────────
    const humanInput = document.getElementById("num-humans");
    const aiInput    = document.getElementById("num-ais");
    const errorDiv   = document.getElementById("player-count-error");
    const humanNames = document.getElementById("human-names");
    const aiConfig   = document.getElementById("ai-players-config");

    function refreshPlayerFields() {
      const h = parseInt(humanInput.value, 10) || 0;
      const a = parseInt(aiInput.value,   10) || 0;

      if (h < 1 || h + a > 4) {
        errorDiv.style.display = "block";
        humanNames.innerHTML = "";
        aiConfig.innerHTML   = "<h3>AI Players</h3>";
        return;
      }
      errorDiv.style.display = "none";

      humanNames.innerHTML = "<h3>Human Player Names</h3>";
      for (let i = 0; i < h; i++) {
        const inp = document.createElement("input");
        inp.type        = "text";
        inp.placeholder = `Human player ${i+1} name`;
        inp.className   = "human-name";
        inp.required    = true;
        humanNames.appendChild(inp);
      }

      aiConfig.innerHTML = "<h3>AI Players</h3>";
      for (let i = 0; i < a; i++) {
        const wrap = document.createElement("div");
        wrap.className = "ai-player-block";

        const n = document.createElement("input");
        n.type        = "text";
        n.placeholder = `AI player ${i+1} name`;
        n.className   = "ai-name";
        n.required    = true;

        const p = document.createElement("input");
        p.type        = "text";
        p.placeholder = `AI player ${i+1} personality`;
        p.className   = "ai-personality";

        wrap.append(n, p);
        aiConfig.appendChild(wrap);
      }
    }

    humanInput.addEventListener("input", () => {
      aiInput.max = 4 - (parseInt(humanInput.value,10) || 0);
      refreshPlayerFields();
    });
    aiInput.addEventListener("input", () => {
      if ((parseInt(aiInput.value,10) || 0) > 4 - (parseInt(humanInput.value,10)||0)) {
        aiInput.value = 4 - (parseInt(humanInput.value,10)||0);
      }
      refreshPlayerFields();
    });

    // initial render
    refreshPlayerFields();

    // ─── Start Game Handler ─────────────────────────────────────────────────────
    document.getElementById("start-game-form").addEventListener("submit", async e => {
      e.preventDefault();
      const names = Array.from(document.querySelectorAll(".human-name"))
                         .map(i => i.value.trim())
                         .filter(Boolean);
      const ais   = Array.from(document.querySelectorAll(".ai-name"))
                         .map((n,i) => ({
                           name: n.value.trim(),
                           personality: document.querySelectorAll(".ai-personality")[i].value.trim()
                         }));

      playerName = names[0];
      const proto = window.location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${proto}://${window.location.host}/ws/${playerName}`);
      socket.onmessage = handleSocketMessage;

      await fetch("/start_game", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ human_names: names, ai_players: ais })
      });

      document.getElementById("setup-form").style.display = "none";
      document.getElementById("game-interface").style.display = "block";
      document.getElementById("status").textContent = `Connected as ${playerName}`;
      const ann = document.createElement("p");
      ann.textContent = "🎮 Game started!";
      document.getElementById("announcement-log").append(ann);
    });

    // ─── Board & Path Setup ──────────────────────────────────────────────────────
    const gridSize    = 15;
    const safeOffsets = new Set([0,7,14,21,28,35,42,49]);

    function rowColToIndex(r,c){ return r * gridSize + c; }

    function getOuterLoop() {
      const cells = [];
      for (let col=0; col<gridSize; col++)               cells.push(rowColToIndex(gridSize-1,col));
      for (let row=gridSize-2; row>=0; row--)             cells.push(rowColToIndex(row,gridSize-1));
      for (let col=gridSize-2; col>=0; col--)             cells.push(rowColToIndex(0,col));
      for (let row=1; row<gridSize-1; row++)              cells.push(rowColToIndex(row,0));
      return cells.slice(0,52);
    }

    const basePath = getOuterLoop();
    const safeCells = new Set([...safeOffsets].map(o => basePath[o]));

    function rotatePath(p,off){ return p.slice(off).concat(p.slice(0,off)); }

    const pathMapping = {
      yellow: rotatePath(basePath,  0),
      green:  rotatePath(basePath, 14),
      blue:   rotatePath(basePath, 28),
      red:    rotatePath(basePath, 42),
    };

    function generateLudoGrid() {
      const board = document.getElementById("ludo-board");
      board.innerHTML = "";
      for (let r=0; r<gridSize; r++) {
        for (let c=0; c<gridSize; c++) {
          const idx = r*gridSize + c;
          const cell = document.createElement("div");
          cell.classList.add("cell");
          if (r<6 && c<6)         cell.classList.add("red-home");
          else if (r<6 && c>8)    cell.classList.add("blue-home");
          else if (r>8 && c<6)    cell.classList.add("yellow-home");
          else if (r>8 && c>8)    cell.classList.add("green-home");
          if (safeCells.has(idx)) cell.classList.add("safe");
          board.appendChild(cell);
        }
      }
    }
    generateLudoGrid();

    function updateBoard(players) {
      document.querySelectorAll(".cell").forEach(c => c.innerHTML = "");
      players.forEach(p => {
        const map = pathMapping[p.color];
        p.tokens.forEach(pos => {
          if (pos != null && map[pos] != null) {
            const cell = document.querySelectorAll(".cell")[ map[pos] ];
            const dot  = document.createElement("div");
            dot.className = `token ${p.color}`;
            cell.appendChild(dot);
          }
        });
      });
    }

    function handleSocketMessage(event) {
      const data = JSON.parse(event.data);
      switch (data.type) {
        case "your_turn":
          showTokenSelection(data.tokens, data.movableIndexes);
          break;
        case "roll_dice":
          document.getElementById("roll-dice-form").style.display = "block";
          break;
        case "board_update":
          updateBoard(data.players);
          break;
        case "announcement":
          {
            const log = document.getElementById("announcement-log");
            document.getElementById("announcement-placeholder")?.remove();
            const p = document.createElement("p");
            p.textContent = data.message;
            log.appendChild(p);
            setTimeout(() => log.scrollTop = log.scrollHeight, 50);
          }
          break;
        case "game_state":
          {
            const st = document.getElementById("game-state-log");
            st.innerHTML = "";
            const pre = document.createElement("pre");
            pre.textContent = data.message;
            st.appendChild(pre);
          }
          break;
        case "game_over":
          alert(data.message);
          document.getElementById("status").textContent = data.message;
          break;
      }
    }

    function submitRollDice() {
      socket.send(JSON.stringify({ type: "roll_dice_result", result: "rolled" }));
      document.getElementById("roll-dice-form").style.display = "none";
    }

    function showTokenSelection(tokens, movable) {
      const c = document.getElementById("token-options");
      c.innerHTML = "";
      movable.forEach(i => {
        const label = document.createElement("label");
        const r     = document.createElement("input");
        r.type      = "radio";
        r.name      = "token";
        r.value     = i;
        label.append(r, ` Token ${i+1} — Position: ${tokens[i] ?? "Base"}`);
        c.append(label, document.createElement("br"));
      });
      document.getElementById("token-select-form").style.display = "block";
    }

    function submitTokenMove() {
      const sel = document.querySelector('input[name="token"]:checked');
      if (!sel) return alert("Please select a token to move.");
      socket.send(JSON.stringify({
        type: "token_move",
        token_index: +sel.value
      }));
      document.getElementById("token-select-form").style.display = "none";
    }
  </script>
</body>
</html>
