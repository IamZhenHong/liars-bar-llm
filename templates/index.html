  <style>
    /* Announcement Log CSS */
    #announcement-log-container {
      margin-top: 20px;
    }
    #announcement-log {
      border: 1px solid #ccc;
      padding: 10px;
      max-height: 200px;
      min-height: 50px; /* Ensures container is visible even if empty */
      overflow-y: auto;
      background: #f9f9f9;
    }
    /* Game State Log CSS */
    #game-state-container {
      margin-top: 20px;
    }
    #game-state-log {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 40px;
      background: #222;        /* Dark background */
      color: #f0f0f0;          /* Light text */
      font-family: monospace;  /* Better for logs */
      white-space: pre-wrap;   /* Preserve line breaks in <pre> */
    }

    #ludo-board {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  grid-template-rows: repeat(15, 1fr);
  width: 450px;      /* or whatever fixed pixel size you like */
  height: 450px;
  gap: 2px;
  border: 2px solid #333;
}
.cell {
  position: relative;
  background-color: #fff;
  border: 1px solid #ccc;
}
.token {
  position: absolute;
  width: 80%;
  height: 80%;
  top: 10%;
  left: 10%;
  border-radius: 50%;
}

  .red { background-color: red; }
  .blue { background-color: blue; }
  .green { background-color: green; }
  .yellow { background-color: gold; }

  .red-home    { background: #f8d7da; }
.blue-home   { background: #d1ecf1; }
.green-home  { background: #d4edda; }
.yellow-home { background: #fff3cd; }
.safe        { box-shadow: inset 0 0 0 2px #333; }


  </style>

<body>
  <div class="container">
    <h1>Ludo Game</h1>

    <div id="setup-form">
      <h2>Game Setup</h2>
      <form id="start-game-form">
        <label>Total players (2–4):
          <input
            type="number"
            id="total-players"
            min="2"
            max="4"
            value="4"
            required
          >
        </label>
        <label>Number of human players:
          <input
            type="number"
            id="num-humans"
            min="0"
            max="4"
            value="1"
            required
          >
        </label>
        <div id="human-names"></div>
        <div id="ai-personalities"><h3>AI Players</h3></div>
        <button type="submit">Start Game</button>
      </form>
    </div>

    <div id="game-interface" style="display:none">
      <h2 id="status"></h2>



    <div id="roll-dice-form" style="display:none">
      <h3>Your Turn — Roll the Dice 🎲</h3>
      <button onclick="submitRollDice()">Roll</button>
    </div>
    
    <div id="token-select-form" style="display:none">
      <h3>Choose a Token to Move</h3>
      <div id="token-options"></div>
      <button onclick="submitTokenMove()">Move Token</button>
    </div>
    

    <div id="ludo-board-container">
      <h3>Ludo Board</h3>
      <div id="ludo-board"></div>

        <!-- Board squares will be generated dynamically -->
      </div>
    </div>
    
    


  </div>

  <!-- Announcement Log -->
  <div id="announcement-log-container">
    <h3>Announcement Log</h3>
    <div id="announcement-log">
      <p id="announcement-placeholder">No announcements yet.</p>
    </div>
  </div>

  <!-- Game State Log -->
  <div id="game-state-container">
    <h3>Game State</h3>
    <div id="game-state-log">
      <p id="game-state-placeholder">No game state available yet.</p>
    </div>
  </div>

  <script>
     let socket = null;
    let playerName = "";
    let observerName = "Observer";
    const totalInput     = document.getElementById("total-players");
    const numInput       = document.getElementById("num-humans");
    const humanContainer = document.getElementById("human-names");
    const aiContainer    = document.getElementById("ai-personalities");
    function updatePlayerInputs() {
      let total = parseInt(totalInput.value, 10) || 2;
      total = Math.min(Math.max(total, 2), 4);
      totalInput.value = total;
      let humans = parseInt(numInput.value, 10) || 0;
      humans = Math.min(Math.max(humans, 0), total);
      numInput.value = humans;
      humanContainer.innerHTML = "<h3>Human Player Names</h3>";
      aiContainer.innerHTML    = "<h3>AI Players</h3>";
      for (let i = 0; i < humans; i++) {
        const inp = document.createElement("input");
        inp.type = "text"; inp.placeholder = `Human player ${i+1} name`;
        inp.className = "human-name";
        humanContainer.appendChild(inp);
      }
      const aiCount = total - humans;
      for (let i = 0; i < aiCount; i++) {
        const block = document.createElement("div"); block.className = "ai-player-block";
        const nameInput = document.createElement("input");
        nameInput.type = "text"; nameInput.placeholder = `AI player ${i+1} name`;
        nameInput.className = "ai-name";
        const persInput = document.createElement("input");
        persInput.type = "text"; persInput.placeholder = `AI player ${i+1} personality`;
        persInput.className = "ai-personality";
        block.appendChild(nameInput);
        block.appendChild(persInput);
        aiContainer.appendChild(block);
      }
    }
    totalInput.addEventListener("change", updatePlayerInputs);
    numInput.addEventListener("change", updatePlayerInputs);
    updatePlayerInputs();


document
  .getElementById("start-game-form")
  .addEventListener("submit", async e => {
    e.preventDefault();

    const startBtn = e.target.querySelector('button[type="submit"]');
    startBtn.disabled = true;
    startBtn.style.display = 'none';

    const humanInputs  = document.querySelectorAll(".human-name");
    const aiNameInputs = document.querySelectorAll(".ai-name");
    const aiPersInputs = document.querySelectorAll(".ai-personality");

    const humanNames = Array.from(humanInputs)
                            .map(i => i.value.trim())
                            .filter(n => n);
    const aiPlayers  = Array.from(aiNameInputs).map((i, idx) => ({
      name:        i.value.trim(),
      personality: aiPersInputs[idx]?.value.trim() || ""
    }));

    const protocol = location.protocol === "https:" ? "wss" : "ws";

    let payload = {
      type: "start_game",
      human_names: humanNames,
      ai_players:  aiPlayers,
      observer_name: null
    };

    if (humanNames.length > 0) {
      // at least one human: connect as that player
      const playerName = humanNames[0];
      socket = new WebSocket(`${protocol}://${location.host}/ws/${playerName}`);
      socket.onmessage = handleSocketMessage;
      socket.onopen    = () => console.log("Player WS connected");
      socket.onerror   = e  => console.error(e);
      socket.onclose   = () => console.warn("Player WS closed");
    } else {
      // no humans: skip player socket entirely
      console.log("No human players: skipping player socket");

         // always connect an observer if you want to see game update
    socket = new WebSocket(`${protocol}://${location.host}/ws/${observerName}`);
    socket.onmessage = handleSocketMessage;
    socket.onopen    = () => console.log("Observer WS connected");
    socket.onerror   = e  => console.error(e);
    socket.onclose   = () => console.warn("Observer WS closed");

      payload.observer_name = observerName;
    }


    // now start the game on the backend
    const resp = await fetch("/start_game", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(payload)
    });

    if (resp.ok) {
      document.getElementById("setup-form").style.display      = "none";
      document.getElementById("game-interface").style.display = "block";
      document.getElementById("status").textContent           = 
        humanNames.length > 0
          ? `Connected as ${humanNames[0]}`
          : `Observing game`;
      const ann = document.createElement("p");
      ann.textContent = "🎮 Game started!";
      document.getElementById("announcement-log").appendChild(ann);
    }
  });

    document.getElementById("num-humans").addEventListener("change", () => {
      const num = parseInt(document.getElementById("num-humans").value, 10);
      const container = document.getElementById("human-names");
      container.innerHTML = "";

      for (let i = 0; i < num; i++) {
        const wrapper = document.createElement("div");
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = `Human player ${i + 1} name`;
        input.name = `human${i}`;
        input.className = "human-name";
        input.required = true;
        wrapper.appendChild(input);
        container.appendChild(wrapper);
      }
    });

  const gridSize = 15;

  const safeOffsets = new Set([0, 7, 14, 21, 28, 35, 42, 49]);

  function rowColToIndex(r, c){ return r*gridSize + c; }

    function rowColToIndex(r, c) {
      return r * gridSize + c;
    }

    // Build the 52‐step outer loop once
    function getOuterLoop() {
      const cells = [];
      // Bottom row, left→right
      for (let col = 0; col < gridSize; col++) {
        cells.push(rowColToIndex(gridSize - 1, col));
      }
      // Right column, bottom-1→top
      for (let row = gridSize - 2; row >= 0; row--) {
        cells.push(rowColToIndex(row, gridSize - 1));
      }
      // Top row, right-1→left
      for (let col = gridSize - 2; col >= 0; col--) {
        cells.push(rowColToIndex(0, col));
      }
      // Left column, top+1→bottom-1
      for (let row = 1; row < gridSize - 1; row++) {
        cells.push(rowColToIndex(row, 0));
      }
      return cells.slice(0, 52);
    }

    const basePath = getOuterLoop();

    const safeCells = new Set(
  [...safeOffsets].map(offset => basePath[offset])
);

    function rotatePath(path, offset) {
  return path.slice(offset).concat(path.slice(0, offset));
}

const pathMapping = {
  yellow: rotatePath(basePath,  0),  // (14,0) bottom-left → yellow-home
  green:  rotatePath(basePath, 14),  // (14,14) bottom-right → green-home
  blue:   rotatePath(basePath, 28),  // (0,14) top-right    → blue-home
  red:    rotatePath(basePath, 42),  // (0,0)  top-left     → red-home
};

      function generateLudoGrid() {
      const board = document.getElementById("ludo-board");
      board.innerHTML = "";

      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const idx = row * gridSize + col;
          const cell = document.createElement("div");
          cell.classList.add("cell");

          // colour the home quadrants…
          if (row < 6 && col < 6)       cell.classList.add("red-home");
          else if (row < 6 && col > 8)  cell.classList.add("blue-home");
          else if (row > 8 && col < 6)  cell.classList.add("yellow-home");
          else if (row > 8 && col > 8)  cell.classList.add("green-home");

          // now highlight safe spots
          if (safeCells.has(idx))       cell.classList.add("safe");

          board.appendChild(cell);
        }
      }
    }


    generateLudoGrid();

    function handleSocketMessage(event) {
      const data = JSON.parse(event.data);
      console.log("[WS] Received:", data);

      if (data.type === "your_turn") {
        console.log(`[WS] ${data.player}'s turn — rolled: ${data.roll}`);
        showTokenSelection(data.tokens, data.movableIndexes);
      }


      if (data.type === "game_over") {
        alert(data.message);
        document.getElementById("status").textContent = data.message;
        document.getElementById("play-form").style.display = "none";
        document.getElementById("challenge-form").style.display = "none";
        document.getElementById("reflect-form").style.display = "none";
      }

      if (data.type === "announcement") {
        // Get the announcement log container
        const logContainer = document.getElementById("announcement-log");

        // Remove placeholder if it exists
        const placeholder = document.getElementById("announcement-placeholder");
        if (placeholder) {
          placeholder.remove();
        }

        // Append the new announcement
        const newEntry = document.createElement("p");
        newEntry.textContent = data.message;
        logContainer.appendChild(newEntry);

        // Delay scrolling to ensure the new entry is rendered
        setTimeout(() => {
          logContainer.scrollTop = logContainer.scrollHeight;
        }, 50);
      }

        if (data.type === "game_state") {
          const stateLog = document.getElementById("game-state-log");

          // Clear previous content
          stateLog.innerHTML = "";

          // Create new entry
          const stateEntry = document.createElement("pre"); // Use <pre> to preserve line breaks
          stateEntry.textContent = data.message; // Use 'message', not 'state_message'

          // Add new state message
          stateLog.appendChild(stateEntry);
        }
        

        if (data.type === "roll_dice") {
          console.log(`[WS] ${data.player}'s turn to roll dice`);
          document.getElementById("game-interface").style.display = "block";
          document.getElementById("roll-dice-form").style.display = "block";
        }
        if (data.type === "board_update") {
          console.log(`[WS] Board updated`);
          updateBoard(data.players);
        }



    }



    function submitRollDice() {
      socket.send(JSON.stringify({
        type: "roll_dice_result",
        result: "rolled"  // you can later modify to include actual number if needed
      }));

      document.getElementById("roll-dice-form").style.display = "none";
    }

    function showTokenSelection(tokens, movableIndexes = []) {
      const container = document.getElementById("token-options");
      container.innerHTML = "";

      movableIndexes.forEach(index => {
        const pos = tokens[index];
        const label = document.createElement("label");
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "token";
        radio.value = index;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(` Token ${index + 1} — Position: ${pos === null ? "🏠 Base" : pos}`));
        container.appendChild(label);
        container.appendChild(document.createElement("br"));
      });

      document.getElementById("token-select-form").style.display = "block";
    }


  function submitTokenMove() {
    const selected = document.querySelector('input[name="token"]:checked');
    if (!selected) {
      alert("Please select a token to move.");
      return;
    }

    socket.send(JSON.stringify({
      type: "token_move",
      token_index: parseInt(selected.value)
    }));

    document.getElementById("token-select-form").style.display = "none";
  }
