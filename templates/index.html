<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Game</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Announcement Log CSS */
    #announcement-log-container { margin-top: 20px; }
    #announcement-log {
      border: 1px solid #ccc;
      padding: 10px;
      max-height: 200px;
      min-height: 50px;
      overflow-y: auto;
      background: #f9f9f9;
    }
    /* Game State Log CSS */
    #game-state-container { margin-top: 20px; }
    #game-state-log {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 40px;
      background: #222;
      color: #f0f0f0;
      font-family: monospace;
      white-space: pre-wrap;
    }

    #ludo-board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      width: 450px;
      height: 450px;
      gap: 2px;
      border: 2px solid #333;
      margin-bottom: 20px;
    }
    .cell {
      position: relative;
      background-color: #fff;
      border: 1px solid #ccc;
    }
    .token {
      position: absolute;
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      border-radius: 50%;
    }

    .red    { background-color: red; }
    .blue   { background-color: blue; }
    .green  { background-color: green; }
    .yellow { background-color: gold; }

    .red-home    { background: #f8d7da; }
    .blue-home   { background: #d1ecf1; }
    .green-home  { background: #d4edda; }
    .yellow-home { background: #fff3cd; }
    .safe        { box-shadow: inset 0 0 0 2px #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ludo Game</h1>

    <div id="setup-form">
      <h2>Game Setup</h2>
      <form id="start-game-form">
        <label>Total players (2–4):
          <input type="number" id="total-players" min="2" max="4" value="4" required>
        </label>
        <label>Number of human players:
          <input type="number" id="num-humans" min="0" max="4" value="1" required>
        </label>
        <div id="human-names"></div>
        <div id="ai-personalities"><h3>AI Players</h3></div>
        <button type="submit">Start Game</button>
      </form>
    </div>

    <div id="game-interface" style="display:none">
      <h2 id="status"></h2>

      <div id="roll-dice-form" style="display:none">
        <h3>Your Turn — Roll the Dice 🎲</h3>
        <button onclick="submitRollDice()">Roll</button>
      </div>

      <div id="token-select-form" style="display:none">
        <h3>Choose a Token to Move</h3>
        <div id="token-options"></div>
        <button onclick="submitTokenMove()">Move Token</button>
      </div>

      <div id="ludo-board-container">
        <h3>Ludo Board</h3>
        <div id="ludo-board"></div>
      </div>
    </div>
  </div>

  <div id="announcement-log-container">
    <h3>Announcement Log</h3>
    <div id="announcement-log">
      <p id="announcement-placeholder">No announcements yet.</p>
    </div>
  </div>

  <div id="game-state-container">
    <h3>Game State</h3>
    <div id="game-state-log">
      <p id="game-state-placeholder">No game state available yet.</p>
    </div>
  </div>

  <script>
    let socket = null;
    const observerName = "Observer";

    // DOM refs
    const totalInput     = document.getElementById("total-players");
    const numInput       = document.getElementById("num-humans");
    const humanContainer = document.getElementById("human-names");
    const aiContainer    = document.getElementById("ai-personalities");

    // Grid constants
    const gridSize = 15;
    function rowColToIndex(r, c){ return r * gridSize + c; }

    // Build the 52‐step path
    function getOuterLoop() {
      const cells = [];
      for (let col = 0; col < gridSize; col++) cells.push(rowColToIndex(gridSize-1,col));
      for (let row = gridSize-2; row >= 0; row--)  cells.push(rowColToIndex(row,gridSize-1));
      for (let col = gridSize-2; col >= 0; col--)  cells.push(rowColToIndex(0,col));
      for (let row = 1; row < gridSize-1; row++)  cells.push(rowColToIndex(row,0));
      return cells.slice(0,52);
    }
    const basePath   = getOuterLoop();
    const safeCells  = new Set([0,7,14,21,28,35,42,49].map(i => basePath[i]));
    function rotatePath(path, offset) {
      return path.slice(offset).concat(path.slice(0,offset));
    }
    const pathMapping = {
      yellow: rotatePath(basePath,  0),
      green:  rotatePath(basePath, 14),
      blue:   rotatePath(basePath, 28),
      red:    rotatePath(basePath, 42),
    };

    // Home‐base cell indices
    const homeCells = {
      red:    [rowColToIndex(1,1), rowColToIndex(1,3), rowColToIndex(3,1),  rowColToIndex(3,3)],
      blue:   [rowColToIndex(1,11),rowColToIndex(1,13),rowColToIndex(3,11), rowColToIndex(3,13)],
      yellow: [rowColToIndex(11,1),rowColToIndex(11,3),rowColToIndex(13,1), rowColToIndex(13,3)],
      green:  [rowColToIndex(11,11),rowColToIndex(11,13),rowColToIndex(13,11),rowColToIndex(13,13)],
    };

    // Generate grid
    function generateLudoGrid() {
      const board = document.getElementById("ludo-board");
      board.innerHTML = "";
      for (let r=0; r<gridSize; r++) {
        for (let c=0; c<gridSize; c++) {
          const idx = rowColToIndex(r,c);
          const cell = document.createElement("div");
          cell.classList.add("cell");
          if (r<6 && c<6)      cell.classList.add("red-home");
          else if (r<6 && c>8) cell.classList.add("blue-home");
          else if (r>8 && c<6) cell.classList.add("yellow-home");
          else if (r>8 && c>8) cell.classList.add("green-home");
          if (safeCells.has(idx)) cell.classList.add("safe");
          board.appendChild(cell);
        }
      }
    }
    generateLudoGrid();

    // Draw pieces (including base tokens)
    function updateBoard(players) {
      const cells = Array.from(document.querySelectorAll(".cell"));
      cells.forEach(c => c.innerHTML = "");
      players.forEach(player => {
        const map = pathMapping[player.color];
        player.tokens.forEach((pos,i) => {
          const idx = (pos==null)
            ? homeCells[player.color][i]
            : map[pos];
          if (cells[idx]) {
            const dot = document.createElement("div");
            dot.className = `token ${player.color}`;
            cells[idx].appendChild(dot);
          }
        });
      });
    }

    // Handle incoming WS messages
    function handleSocketMessage(event) {
      const data = JSON.parse(event.data);
      console.log("[WS] Received:", data);

      if (data.type === "roll_dice") {
        // auto-roll AI turns
        if (data.player !== observerName) {
          const roll = Math.floor(Math.random()*6)+1;
          console.log(`[AUTO] ${data.player} rolled ${roll}`);
          socket.send(JSON.stringify({
            type: "roll_dice_result",
            result: roll
          }));
        }
        document.getElementById("roll-dice-form").style.display = "block";
      }

      if (data.type === "board_update") {
        updateBoard(data.players);
      }

      if (data.type === "announcement") {
        const log = document.getElementById("announcement-log");
        const ph = document.getElementById("announcement-placeholder");
        if (ph) ph.remove();
        const p = document.createElement("p");
        p.textContent = data.message;
        log.appendChild(p);
        setTimeout(()=> log.scrollTop = log.scrollHeight, 50);
      }

      if (data.type === "game_state") {
        const st = document.getElementById("game-state-log");
        st.innerHTML = "";
        const pre = document.createElement("pre");
        pre.textContent = data.message;
        st.appendChild(pre);
      }

      if (data.type === "your_turn") {
        showTokenSelection(data.tokens, data.movableIndexes);
      }

      if (data.type === "game_over") {
        alert(data.message);
        document.getElementById("status").textContent = data.message;
      }
    }

    // Submit functions
    function submitRollDice() {
      socket.send(JSON.stringify({ type: "roll_dice_result", result: "rolled" }));
      document.getElementById("roll-dice-form").style.display = "none";
    }
    function showTokenSelection(tokens, movableIndexes=[]) {
      const cont = document.getElementById("token-options");
      cont.innerHTML = "";
      movableIndexes.forEach(i => {
        const label = document.createElement("label");
        const r = document.createElement("input");
        r.type="radio"; r.name="token"; r.value=i;
        label.append(r, ` Token ${i+1} — Pos: ${
          tokens[i]==null?"Base":tokens[i]
        }`);
        cont.append(label, document.createElement("br"));
      });
      document.getElementById("token-select-form").style.display = "block";
    }
    function submitTokenMove() {
      const sel = document.querySelector('input[name="token"]:checked');
      if (!sel) return alert("Pick a token.");
      socket.send(JSON.stringify({
        type: "token_move",
        token_index: +sel.value
      }));
      document.getElementById("token-select-form").style.display = "none";
    }

    // Dynamic player inputs
    function updatePlayerInputs() {
      let total = Math.min(Math.max(+totalInput.value||2,2),4);
      totalInput.value = total;
      let humans= Math.min(Math.max(+numInput.value||0,0),total);
      numInput.value = humans;
      humanContainer.innerHTML = "<h3>Human Player Names</h3>";
      aiContainer.innerHTML    = "<h3>AI Players</h3>";
      for (let i=0;i<humans;i++){
        const inp=document.createElement("input");
        inp.type="text"; inp.placeholder=`Human player ${i+1}`;
        inp.className="human-name";
        humanContainer.append(inp);
      }
      for (let i=0;i<total-humans;i++){
        const block=document.createElement("div");
        const n=document.createElement("input");
        n.type="text"; n.placeholder=`AI player ${i+1}`;
        n.className="ai-name";
        const p=document.createElement("input");
        p.type="text"; p.placeholder=`Personality`;
        p.className="ai-personality";
        block.append(n,p);
        aiContainer.append(block);
      }
    }
    totalInput.addEventListener("change",updatePlayerInputs);
    numInput.addEventListener("change",updatePlayerInputs);
    updatePlayerInputs();

    // Start form
    document.getElementById("start-game-form")
    .addEventListener("submit", async e=>{
      e.preventDefault();
      e.target.querySelector("button").disabled=true;
      const humanNames = [...document.querySelectorAll(".human-name")]
                          .map(i=>i.value.trim()).filter(Boolean);
      const aiPlayers  = [...document.querySelectorAll(".ai-name")]
                          .map((i,j)=>({
                            name: i.value.trim(),
                            personality: document.querySelectorAll(".ai-personality")[j].value.trim()
                          }));
      const protocol = location.protocol==="https:"?"wss":"ws";
      let payload = { type:"start_game", human_names:humanNames, ai_players: aiPlayers, observer_name:null };

      if (humanNames.length>0) {
        socket = new WebSocket(`${protocol}://${location.host}/ws/${humanNames[0]}`);
      } else {
        socket = new WebSocket(`${protocol}://${location.host}/ws/${observerName}`);
        payload.observer_name = observerName;
      }
      socket.onmessage = handleSocketMessage;
      socket.onopen    = ()=>console.log("WS connected");
      socket.onerror   = e=>console.error(e);
      socket.onclose   = ()=>console.warn("WS closed");

      const resp = await fetch("/start_game", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if (resp.ok) {
        document.getElementById("setup-form").style.display="none";
        document.getElementById("game-interface").style.display="block";
        document.getElementById("status").textContent =
          humanNames.length>0
            ? `Connected as ${humanNames[0]}`
            : `Observing game`;
        document.getElementById("announcement-placeholder").remove();
        const p=document.createElement("p");
        p.textContent="🎮 Game started!";
        document.getElementById("announcement-log").append(p);
        // rebuild grid now that it's visible
        generateLudoGrid();
      }
    });
  </script>
</body>
</html>
